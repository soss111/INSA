<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 110" role="img" aria-label="Kaasrahastanud Euroopa Liit">
  <title>Kaasrahastanud Euroopa Liit</title>
  <defs>
    <polygon id="eu-star" points="0,-5.5 1.236,-1.7 5.23,-1.7 2,0.65 3.236,4.45 0,2.1 -3.236,4.45 -2,0.65 -5.23,-1.7 -1.236,-1.7"/>
    <clipPath id="sail">
      <path d="M4 0 C28 6, 52 18, 68 48 L4 48 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(8,8)">
    <rect width="72" height="48" fill="#003399"/>
    <g fill="#FFCC00" transform="translate(36,24)">
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(0) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(30) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(60) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(90) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(120) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(150) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(180) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(210) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(240) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(270) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(300) translate(0,-14)"/>
      <use xlink:href="#eu-star" href="#eu-star" transform="rotate(330) translate(0,-14)"/>
    </g>
  </g>

  <g transform="translate(92,8)">
    <g clip-path="url(#sail)">
      <rect x="4" y="0" width="64" height="16" fill="#0072CE"/>
      <rect x="4" y="16" width="64" height="16" fill="#000000"/>
      <rect x="4" y="32" width="64" height="16" fill="#FFFFFF"/>
    </g>
  </g>

  <text x="8" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1a2228">Kaasrahastanud Euroopa Liit</text>
  <text x="8" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a6672">Co-funded by the European Union</text>
</svg>
